name: Kash bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run = preview only, test = ping each webhook, run = real run"
        type: choice
        default: dry-run
        options: [dry-run, test, run]

permissions:
  contents: write

concurrency:
  group: kash-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run bot
        env:
          MODE: ${{ github.event.inputs.mode || 'run' }}
          WEBHOOK_NEWS: ${{ secrets.WEBHOOK_NEWS }}
          WEBHOOK_FOOTBALL: ${{ secrets.WEBHOOK_FOOTBALL }}
          WEBHOOK_CRICKET: ${{ secrets.WEBHOOK_CRICKET }}
          WEBHOOK_MATCHDAY: ${{ secrets.WEBHOOK_MATCHDAY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          MATCHDAY_ROLE_ID: ${{ secrets.MATCHDAY_ROLE_ID }}
        run: |
          case "$MODE" in
            dry-run) python bot.py --dry-run ;;
            test)    python bot.py --test ;;
            *)       python bot.py ;;
          esac
      - name: Save state
        if: ${{ (github.event.inputs.mode || 'run') == 'run' }}
        run: |
          git config user.name "kash-bot"
          git config user.email "kash-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "bot state" && git push)
